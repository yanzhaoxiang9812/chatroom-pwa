<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>猪mer</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f5f5f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="聊天室">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
:root{--text:#1a1a1a;--sub:#5a5a5a;--faint:#9a9a9a;--border:transparent;--input-bg:#ffffff;--btn-bg:#e8e8ec;--btn-text:#3a3a3a;--accent:#16a34a}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e8e8ec;color:var(--text);height:100vh;height:100dvh;overflow:hidden;width:100%;display:flex;flex-direction:column}
.card{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#chat-page{display:flex;flex:1;flex-direction:column;min-height:0}
.chat-header{background:rgba(0,0,0,.03);border-bottom:1px solid rgba(0,0,0,.08);padding:14px 18px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.user-bar{display:flex;align-items:center;justify-content:center;width:100%;padding:0 4px;gap:10px;flex-wrap:wrap}
.user-bar .user-item{font-size:11px;font-weight:600;white-space:nowrap;padding:3px 10px;border-radius:12px;border:1px solid rgba(128,128,128,.25);background:rgba(128,128,128,.08);transition:color .3s ease,background .3s ease}
.user-bar .user-item.online{color:#4ade80;background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3)}
.user-bar .user-item.offline{color:#ef4444;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
.chat-header .room-info{display:flex;align-items:center;gap:10px}
.chat-header .actions{position:absolute;right:16px;display:flex;gap:6px}
.chat-header .actions button{padding:5px 12px;border:none;border-radius:20px;background:transparent;color:var(--sub);cursor:pointer;font-size:11px;transition:all .25s ease}
.chat-header .actions button:hover{border-color:var(--sub);color:var(--text);background:rgba(128,128,128,.1);transform:translateY(-1px)}
.messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-thumb{background:rgba(128,128,128,.3);border-radius:10px}
.msg-row{display:flex;align-items:flex-start;gap:8px;max-width:85%;min-width:0;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-row.self{align-self:flex-end;flex-direction:row-reverse}
.msg-row.other{align-self:flex-start}
.avatar{display:none}
.msg-body{display:flex;flex-direction:column;gap:3px}
.msg-row.self .msg-body{align-items:flex-end}
.msg-row.other .msg-body{align-items:flex-start}
.msg-line{display:flex;align-items:center;gap:6px}
.msg-row.self .msg-line{flex-direction:row-reverse}
.msg-name{font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap}
.msg-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.msg-dot.green{background:var(--accent)}
.msg-dot.red{background:#ef4444}
.msg-bubble{font-size:13px;line-height:1.5;word-break:break-word;overflow-wrap:break-word;max-width:100%;padding:8px 12px;border-radius:12px;background:#ffffff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.msg-row.self .msg-bubble{color:var(--text);border-bottom-right-radius:4px}
.msg-row.other .msg-bubble{color:var(--text);border-bottom-left-radius:4px}
.msg-time{font-size:10px;color:var(--faint);padding:0 4px}
.msg.system{align-self:center;color:var(--faint);font-size:11px;padding:4px 12px;background:rgba(128,128,128,.06);border-radius:12px}
.emoji-panel{background:rgba(255,255,255,.92);padding:12px 14px;max-height:160px;overflow-y:auto;flex-shrink:0}
.emoji-tabs{display:flex;gap:10px;margin-bottom:8px;align-items:center}
.emoji-tab{font-size:12px;color:var(--sub);cursor:pointer;padding:3px 8px;border-radius:4px}
.emoji-tab.active{color:#fff;background:rgba(0,0,0,.15)}
.emoji-add{margin-left:auto;font-size:18px;color:var(--sub);cursor:pointer;padding:2px 8px}
.emoji-add:hover{color:var(--text)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:2px}
.emoji-item{font-size:20px;cursor:pointer;padding:3px;text-align:center;border-radius:8px;transition:all .15s ease}
.emoji-item:hover{background:rgba(128,128,128,.15);transform:scale(1.15)}
.emoji-item img{width:32px;height:32px;object-fit:contain;border-radius:4px}
.img-preview{background:rgba(255,255,255,.92);padding:10px 14px;position:relative;flex-shrink:0}
.img-preview img{max-height:100px;border-radius:12px;display:block;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.img-preview .remove-img{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.4);color:#fff;border:none;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;transition:all .2s}
.img-preview .remove-img:hover{background:#ef4444;transform:scale(1.1)}
.img-viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:400;display:none;align-items:center;justify-content:center}
.img-viewer.show{display:flex}
.img-viewer img{width:70vw;height:70vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.img-viewer .close-viewer{position:absolute;top:20px;right:24px;width:36px;height:36px;background:rgba(255,255,255,.15);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:all .2s;border:none}
.img-viewer .close-viewer:hover{background:rgba(239,68,68,.8);transform:scale(1.1)}
.input-area{background:rgba(0,0,0,.03);border-top:1px solid rgba(0,0,0,.08);padding:12px 14px;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.input-area input{flex:1;min-width:0;padding:11px 14px;border:none;border-radius:20px;background:var(--input-bg);color:var(--text);font-size:13px;outline:none;transition:all .25s ease}
.input-area input:focus{border-color:var(--sub);box-shadow:0 0 0 3px rgba(128,128,128,.1)}
.input-area .plus-btn{width:40px;height:40px;border:none;border-radius:50%;background:var(--btn-bg);color:var(--btn-text);font-size:18px;font-weight:700;cursor:pointer;transition:all .25s ease;line-height:1;display:flex;align-items:center;justify-content:center}
.input-area .plus-btn:hover{border-color:var(--sub);color:var(--text);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.input-area #send-btn{padding:11px 18px;border:none;border-radius:20px;background:var(--btn-bg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:all .25s ease}
.input-area #send-btn:hover{opacity:.9;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal-box{background:rgba(255,255,255,.98);border:none;border-radius:16px;padding:20px;width:85%;max-width:300px;max-height:60vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.25)}
.modal-box h3{font-size:14px;margin-bottom:14px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.modal-box .close{cursor:pointer;color:var(--sub);font-size:18px;line-height:1;transition:color .2s}
.modal-box .close:hover{color:#ef4444}
.modal-box input{width:100%;padding:10px 12px;border:none;border-radius:8px;background:var(--input-bg);color:var(--text);font-size:13px;outline:none;margin-bottom:10px}
.modal-box input:focus{border-color:var(--sub)}
.modal-box .modal-btn{width:100%;padding:10px;border:none;border-radius:8px;background:var(--btn-bg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.modal-box .modal-btn:hover{opacity:.85}
.error-toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;z-index:300;display:none}
@media(max-width:480px){.input-area{padding:8px 10px;gap:6px}.input-area input{padding:10px 12px;font-size:16px}.input-area .plus-btn{width:36px;height:36px;font-size:16px}.input-area #send-btn{padding:10px 14px;font-size:12px}.messages{padding:12px}.chat-header{padding:10px 12px}}
</style>
</head>
<body>
<div class="card">
<div id="chat-page" style="display:flex">
<div class="chat-header">
<div class="user-bar" id="user-bar"></div>
<div class="room-info">
</div>
</div>
<div class="messages" id="messages"></div>
<div class="emoji-panel" id="emoji-panel" style="display:none">
<div class="emoji-tabs">
<span class="emoji-tab active" onclick="showEmojiTab('basic')">微信</span>
<span class="emoji-tab" onclick="showEmojiTab('custom')">自定义</span>
<span class="emoji-add" onclick="document.getElementById('emoji-file-input').click()">+</span>
</div>
<div id="emoji-recent" style="display:none;margin-bottom:8px;padding-bottom:8px">
<div style="font-size:11px;color:var(--faint);margin-bottom:6px">最近使用</div>
<div id="emoji-recent-grid" style="display:grid;grid-template-columns:repeat(10,1fr);gap:2px"></div>
</div>
<div class="emoji-grid" id="emoji-grid"></div>
</div>
<input type="file" id="emoji-file-input" accept="image/*" style="display:none" onchange="handleEmojiUpload(this)">
<div class="img-preview" id="img-preview" style="display:none"></div>
<div class="input-area">
<input type="text" id="msg-input" placeholder="输入消息或粘贴图片..." maxlength="2000">
<button class="plus-btn" id="emoji-btn" onclick="toggleEmojiPanel()">😀</button>
<button class="plus-btn" id="plus-btn" onclick="document.getElementById('img-file-input').click()">P</button>
<input type="file" id="img-file-input" accept="image/*" style="display:none" onchange="handleFileSelect(this)">
<button id="send-btn" onclick="sendMessage()">发送</button>
</div>
</div>
</div>
<div class="overlay" id="rename-overlay" onclick="if(event.target===this)closeOverlay('rename-overlay')"><div class="modal-box"><h3>修改昵称 <span class="close" onclick="closeOverlay('rename-overlay')">&times;</span></h3><input type="text" id="rename-input" placeholder="新昵称" maxlength="20"><button class="modal-btn" onclick="doRename()">确定</button></div></div>
<div class="img-viewer" id="img-viewer" onclick="if(event.target===this)closeImgViewer()"><button class="close-viewer" onclick="closeImgViewer()">&times;</button><img id="img-viewer-img" src=""></div>
<div class="error-toast" id="error-toast"></div>
<script src="/app.js?v=20260827s" defer></script>
</body>
</html>
